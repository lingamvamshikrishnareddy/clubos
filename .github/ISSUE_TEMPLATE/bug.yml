name: Bug
description: Something is broken or wrong
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: data
    attributes:
      label: Affected data (source, competition, player or match IDs)
