[project]
name = "clubos-ingest"
version = "0.0.0"
description = "Data connectors for ClubOS, starting with StatsBomb open data."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.scripts]
clubos-ingest-statsbomb = "clubos_ingest.cli:main"
clubos-mock-data = "clubos_ingest.mock:main"
clubos-leagues = "clubos_ingest.leagues:main"
clubos-ingest-nflverse = "clubos_ingest.nflverse:main"
clubos-ingest-cricsheet = "clubos_ingest.cricsheet:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clubos_ingest"]
