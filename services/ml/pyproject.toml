[project]
name = "clubos-ml"
version = "0.0.0"
description = "ClubOS models: valuation, forecasts, tactical fit and workload indicators."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "psycopg[binary]>=3.2"]

[project.scripts]
clubos-ml = "clubos_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8", "clubos-ingest"]

[tool.uv.sources]
clubos-ingest = { path = "../ingest", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clubos_ml"]
